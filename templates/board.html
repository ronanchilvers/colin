<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/css/normalize.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/board.css" />
  <style>
    * {
        box-sizing: border-box;
    }
    html {
      line-height: 1;
      font-size: 16px;
    }
    body {
      font-family: sans-serif;
      margin: 0;
      background: rgb(13,99,177);
    }
    h1, h2, h3, h4 {
      padding: 0;
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    input, textarea {
      font-size: 1rem;
      background-color: transparent;
      border: none;
    }
    input:focus, textarea:focus {
      outline: none;
    }
    header {
      padding: 1rem;
      background-color: rgb(10,82,145);
      color: rgb(255,255,255);
    }
    .board {
      margin: 1rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    #app {
        overflow: auto;
    }
    .column {
      flex: 1;
      background: rgb(216,220,224);
      border-radius: 3px;
      /* min-height: 100px; */
      width: 250px;
      min-width: 250px;
      max-width: 250px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: rgb(42,42,42);
      box-shadow: 0px 2px 5px 0px rgba(9, 70, 127, 1);
    }
    .column h2 {
        margin: 0;
        display: flex;
        flex-direction: column;
        cursor: grab;
    }
    .column__header {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        padding: 0.75rem;
    }
    .control__remove {
        border: 0;
        background-color: transparent;
    }
    .column__content {
      padding: 0.75rem;
      padding-top: 0;
      flex-grow: 1;
    }
    .card-list {
      flex-grow: 1;
    }
    .card {
      background: #fff;
      color: rgb(100,100,100);
      margin: 0 0 0.5rem 0;
      padding: 0.75rem;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0px 1px 3px 0px rgba(139, 149, 158, 0.5);
    }
    .card__header,
    .card__content {
      padding: 0.25rem;
    }
    .add-card {
      padding: 0.75rem;
      padding-top: 0;
    }
    .add-card a {
      color: rgb(134, 134, 134);
      text-decoration: none;
    }
    input, textarea {
      width: 100%;
      padding: 0rem;
    }
    .modal-dimmer {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: rgb(216,220,224);
      padding: 1rem;
      border-radius: 3px;
      margin: auto auto;
      width: 80%;
      height: 80%;
      max-width: 800px;
      display: flex;
      gap: 1rem;
      flex-direction: column;
      justify-content: flex-start;
    }
    .modal__header,
    .modal__content {
      /* padding: 1rem; */
    }
    .modal__header input,
    .modal__content textarea {
      padding: 0.5rem;
      border-radius: 4px;
      font-family: sans-serif;
    }
    .modal__header input:focus,
    .modal__content textarea:focus {
      background-color: rgba(139, 149, 158, 0.5);
    }
    .modal__header {
      display: flex;
      gap: 1rem;
      flex-direction: row;
      justify-content: space-between;
    }
    .modal__header input {
      font-weight: 600;
    }
    .modal__title {
      flex-grow: 1;
    }
    .modal_controls {
      flex-grow: 0;
    }
    .modal__content {
      flex-grow: 1;
    }
    .modal__content textarea {
      height: 100%;
    }
    .ghost-card {
      opacity: 0.4;
      background: #bbb;
    }
    .handle {
      cursor: grab;
      user-select: none;
    }
    .ghost-column {
      opacity: 0.6;
      background: #ddd;
      justify-content: flex-start;
    }
    .ghost-column input,
    .ghost-column button {
      width: 100%;
    }
    .add-column {
      background: rgba(216,220,224, 0.3);
    }
    .add-column input {
      color: rgb(255,255,255);
    }
  </style>
</head>
<body>
    <header>
        <h1>Kanban board</h1>
    </header>
<div id="app">
  <div id="column-container" class="board">
    <div class="column" v-for="column in columns" :key="column.id">
      <div class="column__header">
        <h2 class="handle">
            {{ column.label }}
        </h2>
        <div class="column__control">
            <button v-if="canRemoveColumn(column.id)" @click="removeColumn(column.id)" class="control__remove">X</button>
        </div>
      </div>
      <div :id="`list-${column.id}`" class="column__content card-list">
        <div v-for="(card, index) in board[column.id]" :key="card.id" class="card" @click="openCard(column.id, index)">
          <div class="card__header">
            <h3>{{ card.title }}</h3>
          </div>
          <!-- <div class="card__content" v-if="card.content">
            {{ card.content.slice(0, 30) }}...
          </div> -->
        </div>
      </div>
      <div class="add-card">
        <div>
          <input
            placeholder="Add a card..."
            autocomplete="off"
            v-model="newCard[column.id].title"
            @focus="startAdding(column.id)"
            @keyup.enter="addCard(column.id)"
            @blur="cancelAdd(column.id)" />
        </div>
      </div>
    </div>
    <div class="column add-column">
      <div class="column__header">
        <input v-model="newColumnLabel" placeholder="Add a column..." @keyup.enter="addColumn"/>
      </div>
    </div>
  </div>

  <div class="modal-dimmer" v-if="editingCard">
    <div class="modal">
      <div class="modal__header">
        <div class="modal__title">
          <input v-model="editingCard.card.title" />
        </div>
        <div class="modal__controls">
          <button @click="closeEditor">Close</button>
          <button @click="deleteCard(editingCard.column, editingCard.card)">Delete</button>
        </div>
      </div>
      <div class="modal__content">
        <textarea rows="5" v-model="editingCard.card.content"></textarea>
      </div>
    </div>
  </div>
</div>

<script src="/js/vue.js"></script>
<script src="/js/sortable.min.js"></script>
<script>
const { createApp, reactive, ref, onMounted, nextTick } = Vue;

createApp({
  setup() {
    const boardId = ref(null);
    const board = reactive({});

    const columns = ref([]);

    const newCard = reactive({});

    const editingCard = ref(null);
    const newColumnLabel = ref("");

    async function loadBoard(boardId) {
      try {
        const response = await fetch(`/api/board/${boardId}`);
        if (!response.ok) throw new Error("Failed to fetch board data");
        const data = await response.json();

        if (data.board.columns && data.board.board) {
          columns.value = data.board.columns;
          columns.value.forEach(col => {
            board[col.id] = data.board.board[col.id] || [];
            newCard[col.id] = { title: "", isAdding: false };
          });
        }
        nextTick(() => {
          columns.value.forEach(col => initSortable(col.id));
        });
      } catch (error) {
        console.error("Error loading board:", error);
      }
    }

    async function createColumn(boardId, column) {
      try {
        const response = await fetch(`/api/column`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ board: boardId, ...column })
        });
        if (!response.ok) throw new Error("Failed to save column");
        const result = await response.json();
        return { ...column, id: result.column.id };
      } catch (error) {
        console.error("Error saving column:", error);
        return null;
      }
    }

    async function createCard(columnId, card) {
      try {
        const response = await fetch(`/api/card`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ column: columnId, ...card })
        });
        if (!response.ok) throw new Error("Failed to save card");
        const result = await response.json();
        return { ...card, id: result.card.id };
      } catch (error) {
        console.error("Error saving card:", error);
        return null;
      }
    }

    async function updateCard(columnId, card) {
      try {
        await fetch(`/api/card/${card.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ column: columnId, ...card })
        });
      } catch (error) {
        console.error("Error updating card:", error);
      }
    }

    async function deleteCard(columnId, card) {
      try {
        await fetch(`/api/card/${card.id}`, { method: 'DELETE' });
        const idx = board[columnId].findIndex(c => c.id === card.id);
        if (idx !== -1) board[columnId].splice(idx, 1);
        editingCard.value = null;
      } catch (error) {
        console.error("Error deleting card:", error);
      }
    }

    function startAdding(columnId) {
      newCard[columnId].isAdding = true;
      nextTick(() => {
        const inputs = document.querySelectorAll(`#list-${columnId} ~ .add-card input`);
        if (inputs.length) inputs[0].focus();
      });
    }

    function cancelAdd(columnId) {
      newCard[columnId].title = "";
      newCard[columnId].isAdding = false;
    }

    function addCard(columnId) {
      const title = newCard[columnId].title.trim();
      if (title) {
        createCard(columnId, { title, content: "" }).then(cardWithId => {
          if (cardWithId) {
            board[columnId].push(cardWithId);
          }
        });
      }
      newCard[columnId].title = "";
      newCard[columnId].isAdding = false;
    }

    function openCard(columnId, index) {
      editingCard.value = {
        column: columnId,
        index,
        card: board[columnId][index]
      };
    }

    function closeEditor() {
      if (editingCard.value) {
        updateCard(editingCard.value.column, editingCard.value.card);
      }
      editingCard.value = null;
    }

    function addColumn() {
      const name = newColumnLabel.value.trim();
      if (name) {
        createColumn(boardId.value, { label: name}).then(columnWithId => {
          const id = columnWithId.id
          if (!board[id]) {
            board[id] = [];
            newCard[id] = { title: "", isAdding: false };
            columns.value.push({ id, label: name });
            newColumnLabel.value = "";
            nextTick(() => {
              initSortable(id);
            });
          }
        });
      }
    }

    function removeColumn(columnId) {
      if (board[columnId] && board[columnId].length === 0 && columns.value.length > 1) {
        delete board[columnId];
        delete newCard[columnId];
        const index = columns.value.findIndex(col => col.id === columnId);
        if (index !== -1) columns.value.splice(index, 1);
      }
    }

    function canRemoveColumn(columnId) {
      return board[columnId] && board[columnId].length === 0 && columns.value.length > 1;
    }

    function initSortable(columnId) {
      new Sortable(document.getElementById(`list-${columnId}`), {
        group: 'kanban',
        animation: 150,
        ghostClass: 'ghost-card',
        onAdd(evt) {
          const oldCol = evt.from.getAttribute('id').replace('list-', '');
          const newCol = evt.to.getAttribute('id').replace('list-', '');

          const index = evt.oldIndex;
          const movedCard = board[oldCol].splice(index, 1)[0];
          board[newCol].splice(evt.newIndex, 0, movedCard);
          updateCard(newCol, movedCard);
        }
      });
    }

    onMounted(() => {
      const urlParts = window.location.pathname.split('/');
      boardId.value = urlParts[urlParts.length - 1] || urlParts[urlParts.length - 2];
      loadBoard(boardId.value);

      new Sortable(document.getElementById("column-container"), {
        animation: 150,
        handle: ".handle",
        onMove: (evt) => {
          return !evt.related.classList.contains("add-column");
        },
        onEnd(evt) {
          const moved = columns.value.splice(evt.oldIndex, 1)[0];
          columns.value.splice(evt.newIndex, 0, moved);
        }
      });
    });

    return {
      columns, board, newCard, addCard, openCard, closeEditor, editingCard,
      startAdding, cancelAdd, newColumnLabel, addColumn, removeColumn, canRemoveColumn,
      createCard, updateCard, deleteCard
    };
  }
}).mount("#app");
</script>
</body>
</html>
