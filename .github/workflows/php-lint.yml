name: PHP Lint & Syntax Checks

on:
  push:
    branches: [ "**" ]
    paths:
      - "**.php"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/php-lint.yml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "**.php"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/php-lint.yml"

concurrency:
  group: php-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.4" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: mbstring, pdo_mysql, dom, json

      - name: Show PHP version
        run: php -v

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
            restore-keys: |
              composer-${{ runner.os }}-${{ matrix.php }}-
              composer-${{ runner.os }}-

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

      - name: Install dependencies (no dev if none specified)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Optimize autoloader
        run: composer dump-autoload -o

      - name: List PHP file count
        run: |
          COUNT=$(find . -path './vendor' -prune -o -name '*.php' -print | wc -l)
            echo "Found $COUNT PHP files"
            if [ "$COUNT" -eq 0 ]; then
              echo "No PHP files detected. Exiting."
              exit 1
            fi

      - name: Syntax lint (php -l)
        run: |
          set -e
          echo "Starting parallel syntax checks..."
          # Use xargs for parallel linting; -P controls parallelism
          find . -path './vendor' -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > lint.log || true
          # Show results
          grep -v "No syntax errors detected" lint.log || true
          # Fail if any "Errors parsing" lines
          if grep -q "Errors parsing" lint.log; then
            echo "Syntax errors found:"
            cat lint.log
            exit 1
          fi
          echo "All files passed syntax lint."
          rm lint.log

      - name: Basic runtime smoke (autoload)
        run: |
          php -r "require 'vendor/autoload.php'; echo \"Autoload OK\n\";"

      - name: Summary
        if: success()
        run: |
          echo "✅ PHP ${{ matrix.php }} linting and syntax checks passed."

      - name: Failure Summary
        if: failure()
        run: |
          echo "❌ PHP ${{ matrix.php }} linting failed."
          exit 1
